<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU5 MOD 개발자 사전（수기 작성 인덱스 · 단일 파일）</title>
<style>
  /* CSS는 장식일 뿐, JS가 핵심입니다 */
  :root{--bg:#0f1115;--panel:#161a22;--muted:#8a94a7;--text:#e7ecf3;--accent:#7aa2f7;--border:#252a34;--code:#0b0e14;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#12151c,#10131a)}
  h1{margin:0;font-size:16px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  input[type="text"]{flex:1;min-width:320px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text)}
  .btn{background:#1b2130;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer}
  .btn[aria-pressed="true"]{outline:2px solid var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:#1b2130;border:1px solid var(--border);border-radius:999px;padding:6px 10px;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{outline:1px solid var(--accent);background:#1a2434}
  main{display:grid;grid-template-columns:360px 1fr;height:100%;min-height:0}
  .left{border-right:1px solid var(--border);overflow:auto}
  .right{overflow:auto}
  .result{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
  .result:hover{background:#141925}
  .muted{color:var(--muted);font-size:12px}
  .entry{padding:16px 20px;max-width:1100px}
  pre,code{font-family:ui-monospace,Menlo,Consolas,monospace}
  pre{background:var(--code);border:1px solid var(--border);padding:10px 12px;border-radius:8px;overflow:auto}
  .pill{border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted);font-size:12px;margin-left:8px}
  .hr{height:1px;background:var(--border);margin:10px 0 14px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>EU5 MOD 개발자 사전 <span class="pill">수기 작성 인덱스</span></h1>
    <div class="row">
      <input id="q" type="text" placeholder="검색(AND / OR / -제외; 필드: type:key|event|component|group; parent:; re:true=정규식)">
      <button class="btn" id="btnSearch">검색</button>
      <button class="btn" id="btnClear">지우기</button>
      <button class="btn" id="btnRegex" aria-pressed="false">Regex</button>
      <button class="btn" id="btnHelp">도움말</button>
    </div>
    <div class="row">
      <div class="chips">
        <div class="chip" data-kind="Key" aria-pressed="true">키</div>
        <div class="chip" data-kind="Event" aria-pressed="true">이벤트</div>
        <div class="chip" data-kind="Component" aria-pressed="true">컴포넌트</div>
        <div class="chip" data-kind="Group" aria-pressed="true">메타 상위 그룹</div>
      </div>
    </div>
  </header>

  <main>
    <section class="left">
      <div id="results"></div>
    </section>
    <section class="right">
      <div class="entry" id="entry"><div class="muted">키워드를 입력한 뒤 “검색”을 클릭하거나, 왼쪽의 항목을 바로 클릭하세요.</div></div>
    </section>
  </main>
</div>

<script id="DATA" type="application/json">{"entries": [{"id": "gui", "name": "GUI", "kind": "Group", "group": "GUI", "parents": ["GUI"], "section": null, "description": "그래픽 라이브러리의 총괄 진입점입니다. 모든 `Component`, `Key`, `Event` 항목은 GUI 그룹에 수록되어 있으며, 검색창에서 `type:` 또는 `parent:`로 필터링할 수 있고, 결과 페이지 안에 있는 `icon` 같은 명사 링크를 직접 클릭해서 이동할 수도 있습니다.\n\n각 항목 자체는 코드를 제공하지 않고, 다음과 같은 점을 알려줍니다. 모든 예시는 기본적으로 EU5 `widget` 스크립트 컨텍스트에서 실행되며, 실제 UI 파일과 완전히 동일합니다. 예시 블록을 그대로 여러분의 `.gui` 파일 안에 붙여넣기만 하면 실행할 수 있습니다.", "examples": [{"language": "gui", "code": "widget = {\n    size = { 320 80 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    background = { using = bg_round_corners_alt_texture }  # 컨트롤 뒤에 렌더링되는 배경 레이어\n    hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n        spacing = 10  # 컨테이너 자식 요소 간 간격\n        icon = { texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\" size = { 32 32 } }  # 중첩된 아이콘, 추가 장식용\n        text_single = { text = \"GUI 文档示例\" align = left|center }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": []}, {"id": "icon", "name": "icon", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`icon` 은 EU5 UI에서 가장 흔한 이미지 컨트롤로, 기본적으로 `types Default` 에 선언된 `icon` 타입을 상속합니다. 모든 `Key` 와 `Event` 를 연결할 수 있고, 같은 블록 안에 `button-`, `icon-`, `text_single-` 등의 자식 컨트롤을 중첩해서 넣을 수 있습니다.\n\n일반적인 사용 방식:\n- `size`, `position`, `parentanchor` / `widgetanchor` 로 레이아웃을 고정한 뒤, `texture`, `texture_density`, `spriteType`, `spriteborder`, `frame_grid` 등을 조합해 스프라이트를 구성한다.\n- `glow`, `color`, `tintcolor`, `modify_texture` 로 각종 이펙트를 얹고, 동시에 `tooltip` / `tooltipwidget`, `onclick`, `onmousehierarchyenter`, `action_tooltip` 등의 인터랙션을 추가한다.\n- 마스크·텍스트·버튼을 조합해야 한다면, `icon` 내부에 직접 `icon = { ... }`, `text_single = { ... }`, `button = { ... }` 를 작성하면 되며, 별도의 래퍼(wrapper)가 필요 없다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    name = \"mapmode_icon\"  # 컨트롤에 이름을 지정해 스크립트 검색 및 디버깅을 쉽게 함\n    size = { 64 64 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    position = { 6 4 }  # 부모 앵커에 대한 오프셋\n    parentanchor = top|left  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n    widgetanchor = top|left  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    texture_density = 2  # 텍스처 밀도(보통 1 또는 2)를 지정\n    spriteType = corneredstretched  # 늘리기 방식 선택(corneredstretched 등)\n    spriteborder = { 8 8 }  # 9-슬라이스에서 스케일되지 않는 테두리 두께 설정\n    frame_grid = { 4 1 }  # 声明序列帧的列/行数量\n    frame = 2  # 스프라이트 시트에서 사용할 프레임 인덱스 선택\n    alpha = 0.9  # 전체 투명도 0~1 제어\n    mirror = horizontal  # 텍스처를 미러링할지 여부(horizontal/vertical)\n    shaderfile = \"gfx/FX/pdxgui_default.shader\"  # 렌더링 Shader 전환으로 특수 블렌딩 구현\n    color = { 1 1 1 1 }  # 전체 색상 입히기(RGBA)\n    tintcolor = { 0.8 0.9 1 1 }  # 마스크/Shader용 치환 색상 설정\n    glow = { name = \"drop_shadow\" glow_radius = 4 color = {0 0 0 0.65} }  # 광원 효과나 그림자 설정 추가\n    modify_texture = { using = color_paper_texture blend_mode = overlay alpha = 0.3 }  # 추가 텍스처나 색상을 오버레이\n    tooltip = \"MAPMODE_TERRAIN\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    tooltipwidget = { using = tooltip_se }  # 기존 툴팁 컴포넌트에 바인딩(예: tooltip_se)\n    onclick = \"[MapMode.SetActive]\"  # 왼쪽 클릭 시 실행할 스크립트\n    onmousehierarchyenter = \"[HighlightMapMode(MapMode.Self)]\"  # 마우스가 컨트롤 트리에 진입했을 때 트리거\n    icon = { size = { 80% 80% } texture = \"gfx/interface/icons/flat_icons/map.dds\" }  # 중첩된 아이콘, 추가 장식용\n    text_single = { align = center|nobaseline text = \"M\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "button", "name": "button", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`button` 은 상호작용 가능한 컨트롤로, 상태별 스프라이트(up/over/down/disable), 애니메이션, `action_tooltip` 을 지원합니다. 버튼 내부에 `icon`, `text_single` 또는 기타 `widget` 을 배치할 수 있으며, `onclick`, `onrightclick` 등의 이벤트로 스크립트를 트리거합니다.\n\n권장 사항: 템플릿(예: `button_regular_template`)과 함께 사용해 일관된 UI 스타일을 유지하세요. `enabled`, `tooltip`, `tooltipwidget` 등을 활용해 플레이어에게 명확한 피드백을 제공하세요. 버튼이 게임 명령을 대표한다면, 가능하면 `action_tooltip` 을 제공해 Hover 시 “좌클릭: 실행 / 우클릭: 취소” 같은 설명이 자동으로 뜨도록 하는 것이 좋습니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    size = { 160 36 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    using = button_regular_template  # 프리셋 템플릿 재사용(texture, button 등)\n    action_tooltip = {  # 좌클릭/우클릭/단축키 설명 정의\n        click_type = left\n        click_mode = instant\n        on_action = \"[IssueCommand]\"  # action_tooltip에 바인딩된 좌클릭 스크립트\n        on_right_click = \"[ShowDetailsPopup]\"\n    }\n    onclick = \"[IssueCommand]\"  # 왼쪽 클릭 시 실행할 스크립트\n    onrightclick = \"[ShowDetailsPopup]\"  # 오른쪽 클릭 시 실행할 스크립트\n    onpressed = \"[PlayClickSound]\"  # 왼쪽 버튼을 누르는 순간 트리거\n    onreleased = \"[StopClickSound]\"  # 왼쪽 버튼을 뗄 때 트리거\n    tooltip = \"BUTTON_ORDER\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    text_single = { text = \"Send Order\" align = center|nobaseline }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "widget", "name": "widget", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`widget` 은 기본 컨테이너로, `size`, `layoutpolicy_horizontal`, `layoutpolicy_vertical` 등 레이아웃 속성을 담당합니다. 별도의 특수 렌더링은 없으며, 단지 `background`, `icon`, `hbox`, `vbox` 등의 자식들을 하나로 묶어줄 뿐입니다.\n\n사용법: `name` 을 설정해 두면 스크립트에서 `PdxGuiWidget.FindChild` 로 찾아 쓸 수 있습니다. `datacontext` 를 사용해 전체 widget 블록을 어떤 객체에 바인딩할 수 있고, `background`, `flowcontainer`, `state` 와 함께 사용하면 복잡한 팝업도 구현할 수 있습니다.", "examples": [{"language": "gui", "code": "widget = {\n    name = \"card_root\"  # 컨트롤에 이름을 지정해 스크립트 검색 및 디버깅을 쉽게 함\n    size = { 420 -1 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    layoutpolicy_vertical = expanding  # 세로 레이아웃 전략(fixed/expanding 등)\n    background = { using = bg_round_corners_dark }  # 컨트롤 뒤에 렌더링되는 배경 레이어\n    hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n        spacing = 12  # 컨테이너 자식 요소 간 간격\n        icon = { size = { 64 64 } texture = \"gfx/interface/icons/character.dds\" }  # 중첩된 아이콘, 추가 장식용\n        vbox = {  # 세로 컨테이너, 자식 컨트롤 배치\n            layoutpolicy_horizontal = expanding  # 가로 레이아웃 전략(fixed/expanding 등)\n            text_single = { text = \"Widget 标题\" align = left|nobaseline }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n            text_single = { text = \"Secondary line\" align = left|nobaseline color = {0.8 0.8 0.8 1} }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n        }\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "text_single", "name": "text_single", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`text_single` 是最常见的文本控件，支持 `text`、`fontsize`、`align`、`default_format`（富文本颜色）以及 `datacontext` / `textcontext`。结合 `autoresize = yes` 可以根据内容自动扩展，也可以用 `minimumsize` 或 `size = { -1 24 }` 固定高度。\n\n来自脚本的字符串通常写成 `text = \"[Country.GetName]\"`，而静态本地化可以直接引用本地化 key。", "examples": [{"language": "gui", "code": "text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    using = text_single_template  # 프리셋 템플릿 재사용(texture, button 등)\n    align = left|nobaseline  # 텍스트 정렬 방식\n    fontsize = 18  # 텍스트 폰트 크기\n    default_format = \"#color_white\"\n    text = \"[Country.GetName]\"  # 텍스트 내용(문자열 또는 표현식 사용 가능)\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "hbox", "name": "hbox", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`hbox` 는 가로 방향 컨테이너로, 자식 컨트롤이 왼쪽에서 오른쪽으로 배치됩니다. 자주 쓰이는 속성으로 `spacing`, `layoutpolicy_horizontal`, `margin` 등이 있고, `expand = {}` 를 중첩해 공백 영역을 둘 수 있습니다.\n\n카드 헤더, 버튼 내용 등 위치에 `hbox` 를 사용하면 아이콘과 텍스트를 한 줄로 쉽게 정렬할 수 있습니다.", "examples": [{"language": "gui", "code": "hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n    spacing = 6  # 컨테이너 자식 요소 간 간격\n    layoutpolicy_horizontal = expanding  # 가로 레이아웃 전략(fixed/expanding 등)\n    icon = { size = { 24 24 } texture = \"gfx/interface/icons/alert.dds\" }  # 중첩된 아이콘, 추가 장식용\n    text_single = { text = \"横排 hbox 示例\" align = left|center }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    expand = {}\n    button = { size = { 24 24 } onclick = \"[DoToggle]\" icon = { texture = \"gfx/interface/icons/pin.dds\" } }  # 중첩 버튼, 국소적인 상호작용 구현\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "vbox", "name": "vbox", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`vbox` 는 세로 방향 컨테이너로, `spacing`, `layoutpolicy_vertical` 등 동일한 의미의 속성을 따릅니다. `text_single`, `icon`, `hbox` 를 중첩할 수 있으며, `margin` 으로 여백을 조절합니다.\n\n툴팁 설명, 다단 속성 목록처럼 자동으로 길어지는 세로 열이 필요할 때는 `widget` 안에 `vbox` 를 하나 두면 됩니다.", "examples": [{"language": "gui", "code": "vbox = {  # 세로 컨테이너, 자식 컨트롤 배치\n    spacing = 4  # 컨테이너 자식 요소 간 간격\n    layoutpolicy_vertical = expanding  # 세로 레이아웃 전략(fixed/expanding 등)\n    text_single = { text = \"第一行\" align = left|nobaseline }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    text_single = { text = \"第二行\" align = left|nobaseline }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    icon = { size = { 100% 2 } texture = \"gfx/interface/divider.dds\" }  # 중첩된 아이콘, 추가 장식용\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "flowcontainer", "name": "flowcontainer", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`flowcontainer` 는 한 줄에 여러 Item 을 배치하고, `wrap_length` 를 초과하면 줄바꿈을 합니다. 보통 `datamodel` / `item = { ... }` 와 함께 사용하여, 태그, 훈장, 지도 모드 버튼 등을 동적으로 그려냅니다.\n\n팁: `spacing` 은 자식 컨트롤 사이의 가로/세로 간격을 제어합니다. 예상치 못한 줄바꿈을 피하려면 `wrap_length` 를 부모 컨테이너의 폭과 맞추는 것이 좋습니다.", "examples": [{"language": "gui", "code": "flowcontainer = {  # 자동 줄바꿈 컨테이너\n    wrap_length = 260  # flowcontainer 줄바꿈 너비\n    spacing = 6  # 컨테이너 자식 요소 간 간격\n    datamodel = \"[GetPinnedMapModes(PinCollection.Self)]\"  # 데이터 모델을 바인딩해 자식 항목을 반복 생성\n    item = {  # flowcontainer/리스트의 단일 항목 템플릿\n        button = {  # 중첩 버튼, 국소적인 상호작용 구현\n            size = { 36 36 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n            onclick = \"[MapMode.TogglePin]\"  # 왼쪽 클릭 시 실행할 스크립트\n            icon = { texture = \"[MapMode.GetIcon]\" size = { 100% 100% } }  # 중첩된 아이콘, 추가 장식용\n        }\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "piechart", "name": "piechart", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`piechart` 는 원형 차트를 그릴 때 사용하며, 보통 `datacontext` 와 `pie_slice = { color = ... value = ... }` 를 함께 사용합니다. `legend`, `tooltipwidget` 를 추가해 각 비율을 설명할 수 있습니다.\n\n픽셀 단위 정렬을 유지하고 싶다면 고정된 `size` 를 지정하는 것을 잊지 마세요. `visible` 속성을 이용해 데이터 양에 따라 그릴지 말지를 결정할 수도 있습니다.", "examples": [{"language": "gui", "code": "piechart = {  # 파이 차트 컴포넌트, 표시용\n比例数据\n    size = { 120 120 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    datacontext = \"[Country.GetCultureBreakdown]\"  # 스크립트 표현식용으로 컨트롤 데이터 컨텍스트 바인딩\n    pie_slice = {  # 파이 차트 슬라이스 정의\n        color = \"[CultureBreakdownEntry.GetColor]\"  # 전체 색상 입히기(RGBA)\n        value = \"[CultureBreakdownEntry.GetPercentage]\"\n        tooltip = \"[CultureBreakdownEntry.GetLabel]\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "size", "name": "size", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`size = { width height }` 는 컨트롤의 크기를 제어합니다. 숫자는 픽셀을 의미하며, `-1` 은 내용에 따라 자동 조절을 뜻합니다. `100%`, `75%` 같은 퍼센트 값은 부모 컨테이너의 크기를 참조합니다. `icon` 도 마찬가지로 `size = { 48 32 }` 또는 `size = { 80% -1 }` 처럼 써서 리사이즈에 대응할 수 있습니다.\n\n자주 쓰이는 요령: `size = { 0 0 }` 는 배경용으로 남겨 두고, 실제 내용은 `autoresize = yes` 를 사용해 자동으로 크기를 맞춥니다. `spriteType = corneredstretched` 와 함께 사용할 때는, `spriteborder` 를 설정해야 테두리 두께가 유지됩니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    size = { 48 32 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/icons/flat_icons/research.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "position", "name": "position", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`position = { x y }`는 `parentanchor`를 기준으로 한 픽셀 단위 오프셋입니다. 양수는 오른쪽/아래쪽, 음수는 왼쪽/위쪽을 의미하며, 퍼센트 단위 크기와 함께 사용해 고정 레이아웃 안에서 요소 위치를 미세 조정할 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    parentanchor = top|right  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n    widgetanchor = top|right  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n    position = { -12 6 }  # 부모 앵커에 대한 오프셋\n    texture = \"gfx/interface/icons/pin.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "parentanchor", "name": "parentanchor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`parentanchor`는 부모 컨테이너의 기준점으로, 예를 들어 `top|left`, `center`, `bottom|right` 등을 지정합니다. `widgetanchor`, `position`과 함께 사용하면 현재 컨트롤을 부모 컨트롤 안에서 정밀하게 정렬할 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    parentanchor = bottom|right  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n    widgetanchor = bottom|right  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n    position = { -8 -8 }  # 부모 앵커에 대한 오프셋\n    texture = \"gfx/interface/icons/flat_icons/lock.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "widgetanchor", "name": "widgetanchor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`widgetanchor`는 현재 컨트롤 자체의 기준 앵커를 결정합니다. 기본값은 `top|left`이며, 중심이나 오른쪽 아래를 기준으로 정렬하고 싶다면 `widgetanchor = center` 또는 `widgetanchor = bottom|right`로 설정한 뒤 `parentanchor`와 함께 사용하면 됩니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    size = { 32 32 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    parentanchor = center  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n    widgetanchor = center  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n    texture = \"gfx/interface/icons/flat_icons/target.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "align", "name": "align", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`align`은 `text_single`의 정렬 방식을 제어합니다. 예를 들어 `align = left|nobaseline`, `align = center|nobaseline`처럼 씁니다. `hbox` 안에서 수직 중앙 정렬을 하고 싶다면 `align = left|center`, `vbox` 안에서 상단 정렬을 하고 싶다면 `align = center|top`을 사용합니다.", "examples": [{"language": "gui", "code": "text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    align = center|nobaseline  # 텍스트 정렬 방식\n    fontsize = 18  # 텍스트 폰트 크기\n    text = \"Center Text\"  # 텍스트 내용(문자열 또는 표현식 사용 가능)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "layoutpolicy_horizontal", "name": "layoutpolicy_horizontal", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "가로 방향 레이아웃 전략으로, `fixed`(기본값, 크기는 `size`를 따름), `expanding`(남은 공간을 차지), `minimum`(내용을 딱 감쌀 정도) 등을 사용할 수 있습니다. `layoutpolicy_vertical`과 함께 쓰면 `widget`이 `hbox`/`vbox` 안에서 탄력적으로 늘어나거나 줄어들게 할 수 있습니다.", "examples": [{"language": "gui", "code": "hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n    text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n        layoutpolicy_horizontal = expanding  # 가로 레이아웃 전략(fixed/expanding 등)\n        text = \"Description grows with parent\"  # 텍스트 내용(문자열 또는 표현식 사용 가능)\n    }\n    button = { size = { 80 28 } text_single = { text = \"Action\" } }  # 중첩 버튼, 국소적인 상호작용 구현\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "layoutpolicy_vertical", "name": "layoutpolicy_vertical", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "세로 방향 레이아웃 전략으로, 보통 `expanding`(남은 높이를 가득 채움)과 `minimum`(내용 높이에 맞춤)을 사용합니다. 예를 들어 스크롤 영역에서 `layoutpolicy_vertical = expanding`을 사용하면 배경이 스크롤 영역 높이에 맞게 늘어나도록 만들 수 있습니다.", "examples": [{"language": "gui", "code": "widget = {\n    size = { -1 120 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    layoutpolicy_vertical = expanding  # 세로 레이아웃 전략(fixed/expanding 등)\n    background = { using = bg_round_corners_dark }  # 컨트롤 뒤에 렌더링되는 배경 레이어\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "allow_outside", "name": "allow_outside", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`allow_outside = yes`는 컨트롤이 부모 컨테이너 영역 밖까지 그려지는 것을 허용합니다. 그림자나 플로팅 툴팁 같은 용도에 쓸 수 있습니다. 예를 들어 `map mode` 버튼의 장식 아이콘이 배경 밖으로 조금 튀어나올 때, 이 옵션을 켜서 영역을 넘어가도록 해야 합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    allow_outside = yes  # 부모 컨테이너를 벗어난 그리기 허용\n    size = { 40 40 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/icons/flat_icons/ribbon.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "ignore_layout", "name": "ignore_layout", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`ignore_layout = yes`는 컨트롤이 포함된 `hbox`/`vbox`의 자동 레이아웃에서 벗어나, `position`과 `parentanchor`를 사용해 직접 배치되도록 합니다. 카드 모서리 배지나 오버레이 마스크처럼 겹쳐 놓는 요소에 자주 사용됩니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    ignore_layout = yes  # 부모 컨테이너 레이아웃을 무시하고 직접 위치 지정\n    parentanchor = top|right  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n    widgetanchor = top|right  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n    position = { -4 4 }  # 부모 앵커에 대한 오프셋\n    texture = \"gfx/interface/icons/flat_icons/ribbon.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "resizeparent", "name": "resizeparent", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`resizeparent = yes`일 때, 부모 컨트롤은 현재 컨트롤의 크기를 기준으로 자신의 크기를 다시 계산합니다. 보통 tooltip에서 사용하며, `text_single`에 `resizeparent`를 켜 두면 부모 `widget`이 텍스트 높이에 자동으로 맞춰지도록 할 수 있습니다.", "examples": [{"language": "gui", "code": "text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    resizeparent = yes  # 현재 컨트롤 크기에 맞춰 부모 컨테이너를 조정\n    autoresize = yes  # 텍스트/컨트롤이 내용에 따라 자동 확장될지 여부\n    text = \"[DynamicTooltip.GetDescription]\"  # 텍스트 내용(문자열 또는 표현식 사용 가능)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "visible", "name": "visible", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`visible` 支持布尔表达式或脚本调用，如 `visible = \"[Country.HasParliament]\"`。引擎会在 UI 刷新时重新计算，从而隐藏或显示该控件。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    visible = \"[Country.HasParliament]\"  # 표시 여부를 제어, 표현식 사용 가능\n    texture = \"gfx/interface/icons/flat_icons/parliament.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "visible_at_creation", "name": "visible_at_creation", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "초기 가시성을 제어합니다. 특정 애니메이션에서 표시를 늦추고 싶다면 `visible_at_creation = no`로 두고, 이후 스크립트에서 `.Show()`를 호출해 애니메이션을 시작할 수 있습니다.", "examples": [{"language": "gui", "code": "widget = {\n    visible_at_creation = no  # 초기 생성 시 표시 여부\n    state = { name = show duration = 0.2 alpha = 1 }  # 애니메이션 상태(show/hide 등)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "enabled", "name": "enabled", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`enabled` 또는 스크립트 표현식으로 컨트롤의 상호작용 가능 여부를 제어합니다. 비활성화되면 `button`은 disable 프레임으로 전환되고, `icon`은 마우스 이벤트에 반응하지 않습니다. 반드시 `tooltip`과 함께 사용해 플레이어에게 사용할 수 없는 이유를 알려주어야 합니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    enabled = \"[Not(Country.CanAffordCost)]\"  # 상호작용 가능 여부, 보통 표현식으로 제어\n    tooltip = \"BTN_DISABLED_CANNOT_AFFORD\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    text_single = { text = \"Construct\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "alwaystransparent", "name": "alwaystransparent", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`alwaystransparent = yes`일 때, 컨트롤은 마우스 이벤트를 가로채지 않습니다(일종의 “클릭 투과” 효과). 장식 레이어나 그림자 레이어처럼 보이기만 하고 상호작용에는 영향을 주지 않아야 할 때 사용합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    alwaystransparent = yes  # 마우스 투과 허용(표시만 하고 이벤트는 가로채지 않음)\n\n    size = { 100% 100% }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/masks/card_glow.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "scissor", "name": "scissor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`scissor = yes`는 클리핑을 활성화해, 자식 컨트롤이 현재 영역 안에서만 그려지도록 합니다. 스크롤 영역(`scrollarea`)이나 `map list`에서 넘치는 부분을 숨기기 위해 흔히 사용됩니다.", "examples": [{"language": "gui", "code": "widget = {\n    scissor = yes  # 클리핑을 켜서 넘친 내용을 숨김\n    size = { 240 80 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    flowcontainer = {  # 자동 줄바꿈 컨테이너\n        wrap_length = 220  # flowcontainer 줄바꿈 너비\n        spacing = 6  # 컨테이너 자식 요소 간 간격\n        icon = { texture = \"gfx/interface/icons/flat_icons/tag.dds\" size = { 24 24 } }  # 중첩된 아이콘, 추가 장식용\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "texture", "name": "texture", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`texture` 指向 DDS 贴图或脚本函数返回的贴图 path，例如 `\"gfx/interface/icons/... .dds\"` 或 `\"[GetInstitutionIcon(AdvanceItem.GetDefinition)]\"`。配合 `texture_density`、`spriteType` 可在不同 DPI 下保持清晰。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"[GetInstitutionIcon(AdvanceItem.GetDefinition)]\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    size = { 32 32 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "texture_density", "name": "texture_density", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스처 밀도를 설정합니다(보통 1 또는 2). 고해상도 텍스처에서 `texture_density = 2`를 지정하면, 엔진이 원하는 크기에 맞게 자동으로 스케일링하여 흐릿해지는 것을 방지합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    texture_density = 2  # 텍스처 밀도(보통 1 또는 2)를 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spritetype", "name": "spriteType", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteType`은 텍스처의 렌더링 방식을 결정합니다. 예를 들어 `corneredstretched`(나인패치 확장), `corneredtiled`, `stretched` 등이 있습니다. `spriteType = corneredstretched`를 사용할 때는 반드시 `spriteborder`를 함께 지정해 어느 영역을 늘릴 수 있는지 설정해야 합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/buttons/card_button.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    spriteType = corneredstretched  # 늘리기 방식 선택(corneredstretched 등)\n    spriteborder = { 12 12 }  # 9-슬라이스에서 스케일되지 않는 테두리 두께 설정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spritetype", "name": "spritetype", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spritetype`은 `spriteType`의 소문자 버전으로, 구버전 스크립트와의 호환성을 위해 남겨둔 것입니다. 기능은 `spriteType`과 완전히 동일하며 둘 중 하나만 사용하면 됩니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/buttons/card_button.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    spritetype = corneredstretched  # 늘리기 방식 선택(corneredstretched 등)\n    spriteborder = { 12 12 }  # 9-슬라이스에서 스케일되지 않는 테두리 두께 설정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spriteborder", "name": "spriteborder", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteborder = { horizontal vertical }`(또는 네 값 `{ left top right bottom }`)는 `corneredstretched` / `corneredtiled`에서 사용되며, 늘어나지 않는 모서리의 크기를 의미합니다. 값이 클수록 중앙의 가변(늘어나는) 영역은 작아집니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    spriteborder = { 20 12 }  # 9-슬라이스에서 스케일되지 않는 테두리 두께 설정\n    spriteType = corneredstretched  # 늘리기 방식 선택(corneredstretched 등)\n    texture = \"gfx/interface/buttons/button_regular.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spriteborder", "name": "spriteBorder", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteBorder`는 대소문자만 다른 변형으로, 보통 CK3/IR 스크립트에서 가져온 코드에 등장합니다. `spriteborder`와 완전히 동일하며, 단지 첫 글자만 대문자인 형태입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    spriteBorder = { 30 8 }  # 9-슬라이스에서 스케일되지 않는 테두리 두께 설정\n    spriteType = corneredstretched  # 늘리기 방식 선택(corneredstretched 등)\n    texture = \"gfx/interface/buttons/paper_tab.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "frame", "name": "frame", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스처에 여러 프레임이 포함된 스프라이트 시트(Sprite Sheet)일 경우, `frame`은 표시할 프레임 번호를 지정합니다(0부터 시작). `frame_grid` 또는 `framesize`와 함께 사용합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/map_mode_states.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    frame_grid = { 4 1 }  # 声明序列帧的列/行数量\n    frame = 2  # 스프라이트 시트에서 사용할 프레임 인덱스 선택\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "framesize", "name": "framesize", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스처에 `frame_grid`가 없으면 `framesize = { width height }`로 단일 프레임의 크기를 직접 지정하고, `frame`과 함께 써서 원하는 프레임을 뽑아낼 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/seals_sheet.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    framesize = { 47 46 }  # 直接지정\n单帧的像素宽高\n    frame = 5  # 스프라이트 시트에서 사용할 프레임 인덱스 선택\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "frame_grid", "name": "frame_grid", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`frame_grid = { columns rows }`는 이 텍스처가 가로 몇 칸, 세로 몇 칸으로 균등 분할되어 있는지 렌더러에 알려줍니다. 이후 `frame`으로 몇 번째 프레임을 쓸지 선택합니다. 자주 쓰이는 값은 `{ 4 1 }` 또는 `{ 3 1 }`입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/advances_sheet.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    frame_grid = { 3 1 }  # 声明序列帧的列/行数量\n    frame = 1  # 스프라이트 시트에서 사용할 프레임 인덱스 선택\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "alpha", "name": "alpha", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`alpha`는 전체 투명도를 제어하며, 범위는 0~1입니다. 페이드 아웃/하이라이트 애니메이션에 쓰거나, 배경을 살짝 반투명하게 만드는 데 사용할 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    alpha = 0.4  # 전체 투명도 0~1 제어\n    texture = \"gfx/interface/masks/card_overlay.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "mirror", "name": "mirror", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`mirror = horizontal` 또는 `mirror = vertical`은 텍스처를 좌우/상하로 반전합니다. 한쪽 방향만 있는 장식 리소스를 재활용할 때 자주 사용합니다. 기본값은 미러링 없음입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/decorations/corner_flavor.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    mirror = vertical  # 텍스처를 미러링할지 여부(horizontal/vertical)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "shaderfile", "name": "shaderfile", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "지정\n渲染 Shader，例如 `\"gfx/FX/pdxgui_default.shader\"`、`\"gfx/FX/gui_threecolor_blendable_mask.shader\"`。只有在需要特殊混色、遮罩或 ECS 视窗时才需要改写。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    shaderfile = \"gfx/FX/gui_threecolor_blendable_mask.shader\"  # 렌더링 Shader 전환으로 특수 블렌딩 구현\n    gfxtype = three_color_blendable_mask\n    texture = \"gfx/interface/icons/unit_mask.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "color", "name": "color", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`color = { r g b a }`는 정점 색을 직접 덮어쓰며, 단색 텍스처를 원하는 색으로 물들이는 데 많이 사용합니다. `tintcolor`와의 차이점은, `color`는 스프라이트 전체에 영향을 주는 반면 `tintcolor`는 지정된 셰이더 채널에만 적용된다는 점입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/shapes/circle.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    color = { 0.2 0.7 1 0.8 }  # 전체 색상 입히기(RGBA)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "tintcolor", "name": "tintcolor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`tintcolor`는 일부 셰이더(예: blendable mask)를 사용할 때 교체 색을 결정합니다. 보통 `[GetCountryPrimaryColor]` 같은 스크립트 표현식 형태로 작성합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    shaderfile = \"gfx/FX/gui_threecolor_blendable_mask.shader\"  # 렌더링 Shader 전환으로 특수 블렌딩 구현\n    tintcolor = \"[GetCountryPrimaryColor]\"  # 마스크/Shader용 치환 색상 설정\n    texture = \"gfx/interface/masks/unit_mask.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "blend_mode", "name": "blend_mode", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "블렌드 모드(`normal`, `multiply`, `overlay`, `alphamultiply` 등)를 설정합니다. 주로 `modify_texture`와 함께 사용해, 오버레이 텍스처와 메인 텍스처를 섞는 용도로 씁니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/buttons/paper_card.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    modify_texture = {  # 추가 텍스처나 색상을 오버레이\n        using = color_brown_leather_texture  # 프리셋 템플릿 재사용(texture, button 등)\n        blend_mode = overlay\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "modify_texture", "name": "modify_texture", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "이 블록은 추가 텍스처나 색상을 레이어처럼 덧씌울 수 있으며, 여러 번 반복해서 쓸 수 있습니다. 매번 `using`, `texture`, `blend_mode`, `alpha` 등을 지정할 수 있습니다. `button`에 종이 질감을 더하거나 `icon`에 컬러 오버레이를 입히는 데 특히 적합합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/buttons/paper_card.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    modify_texture = { using = color_brown_leather_texture alpha = 0.3 }  # 추가 텍스처나 색상을 오버레이\n    modify_texture = { using = overlay_paper_03 blend_mode = overlay alpha = 0.6 }  # 추가 텍스처나 색상을 오버레이\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "using", "name": "using", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`using = template_name`은 `types`에 정의된 템플릿을 불러와 한 번에 전체 속성을 재사용합니다. 하나의 블록 안에 여러 개의 `using`을 연달아 쓸 수 있으며, 나중에 쓴 값이 먼저 쓴 값을 덮어씁니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    using = button_regular_texture  # 프리셋 템플릿 재사용(texture, button 등)\n    using = button_common_template  # 프리셋 템플릿 재사용(texture, button 등)\n    text_single = { text = \"Template Button\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "background", "name": "background", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`background = { ... }`는 현재 컨트롤 뒤쪽에 추가 레이어를 렌더링하며, 여러 번 등장할 수 있습니다. 보통 종이, 금속 프레임, 마스크 등을 여러 겹으로 쌓고 싶을 때 별도의 자식 `icon`을 만들지 않고 해결하는 데 쓰입니다.", "examples": [{"language": "gui", "code": "widget = {\n    background = { using = bg_round_corners_alt_texture alpha = 0.4 }  # 컨트롤 뒤에 렌더링되는 배경 레이어\n    background = { texture = \"gfx/interface/patterns/paper.dds\" alpha = 0.2 }  # 컨트롤 뒤에 렌더링되는 배경 레이어\n    hbox = { text_single = { text = \"Background 示例\" } }  # 가로 컨테이너, 자식 컨트롤 배치\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "glow", "name": "glow", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`glow = { name = \"drop_shadow\" glow_radius = 4 color = {0 0 0 0.6} }` 这类 block 控制发光或阴影。属性包括 `glow_radius`、`color`、`alpha`，一般用于按钮 hover 或高亮状态。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/flat_icons/star.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    glow = { name = \"drop_shadow\" glow_radius = 5 color = {0 0 0 0.7} }  # 광원 효과나 그림자 설정 추가\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "datacontext", "name": "datacontext", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "将控件바인딩\n到一个脚本对象，使内部表达式可以直接引用它。例如 `datacontext = \"[Character.Self]\"` 后，子控件就能写 `text = \"[Character.GetName]\"`。这是 UI 和脚本交互的核心机制。", "examples": [{"language": "gui", "code": "widget = {\n    datacontext = \"[Character]\"  # 스크립트 표현식용으로 컨트롤 데이터 컨텍스트 바인딩\n    text_single = { text = \"[Character.GetName]\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "name", "name": "name", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`name` 会给控件设置唯一标识，供脚本或其它控件通过 `PdxGuiWidget.FindChild(\"name\")` 查找。最好只在确实需要脚本访问时才命名，以避免冲突。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    name = \"resource_icon\"  # 컨트롤에 이름을 지정해 스크립트 검색 및 디버깅을 쉽게 함\n    texture = \"gfx/interface/icons/resources/iron.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltip", "name": "tooltip", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "直接지정\n本地化 key 或字符串，当鼠标悬停时显示。`tooltip = \"MAPMODE_TERRAIN\"` 或 `tooltip = \"[GoodsItem.GetTooltip]\"` 都是合法写法。", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    texture = \"gfx/interface/icons/flat_icons/terrain.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    tooltip = \"MAPMODE_TERRAIN\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltip_enabled", "name": "tooltip_enabled", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "툴팁의 표시 허용 여부를 제어하는 불리언 값입니다. `tooltip`이 있어도, 이 값을 `no`로 두면 마우스를 올려도 텍스트가 표시되지 않습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    tooltip = \"SECRET_INFO\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    tooltip_enabled = \"[DebugSettings.IsEnabled]\"  # 툴팁 표시 허용/금지\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltipwidget", "name": "tooltipwidget", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`tooltipwidget = { using = some_tooltip }`는 이미 존재하는 툴팁 위젯(예: `tooltip_se`, `religion_tooltip`)을 바인딩하여, 복잡한 내용이나 다단 정보를 보여줄 수 있게 합니다. 축약 버전은 대개 미리 정의된 툴팁 타입을 그냥 참조하는 형태입니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    tooltipwidget = { using = religion_tooltip }  # 기존 툴팁 컴포넌트에 바인딩(예: tooltip_se)\n    text_single = { text = \"Religion\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltipwidget", "name": "TooltipWidget", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "대문자로 시작하는 `TooltipWidget`은 스크립트에서 “커스텀 툴팁 블록”을 정의할 때 자주 쓰이며, `SimpleContextualTooltipType`, `TooltipTextBlock` 등을 중첩해 제목, 본문, 단축 키 안내를 완전히 직접 구성할 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    TooltipWidget = {  # 커스텀 TooltipWidget 구조체 바인딩\n        SimpleContextualTooltipType = {\n            blockoverride \"title_text\" { text = \"Custom Tooltip\" }\n            blockoverride \"text\" { text = \"详细说明...\" }\n        }\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "state", "name": "state", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "상태 애니메이션 정의는 `state = { name = show duration = 0.25 alpha = 1 }` 같은 형식을 사용합니다. `_show`, `_hide` 등의 이름을 가진 상태를 정의해 두고 스크립트에서 트리거하여, 페이드 인/아웃이나 스케일 애니메이션을 구현할 수 있습니다.", "examples": [{"language": "gui", "code": "widget = {\n    state = { name = _show duration = 0.2 alpha = 1 bezier = { 0.0 1.0 0.0 1.0 } }  # 애니메이션 상태(show/hide 등)\n    state = { name = _hide duration = 0.2 alpha = 0 }  # 애니메이션 상태(show/hide 등)\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "icon-", "name": "icon (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`icon`이나 `widget` 안에서 다시 `icon = { ... }`을 썼을 때, 이 항목은 이런 “중첩 icon”을 설명합니다. 부모 컨테이너의 레이아웃을 그대로 상속하며, 마스크, 뱃지, 추가 레이어 등의 용도로 사용할 수 있습니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    size = { 64 64 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/icons/card_base.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    icon = {  # 중첩된 아이콘, 추가 장식용\n        size = { 48 48 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n        parentanchor = center  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n        widgetanchor = center  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n        texture = \"gfx/interface/icons/flat_icons/army.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "button-", "name": "button (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`button = { ... }`은 `icon`/`widget` 내부에 중첩할 수 있으며, 예를 들어 카드 우상단의 작은 닫기 버튼처럼 부분적인 인터랙션 영역으로 씁니다. 최상위 `button`과 완전히 동일한 속성과 이벤트를 가집니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    size = { 120 80 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/panels/card.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    button = {  # 중첩 버튼, 국소적인 상호작용 구현\n        size = { 18 18 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n        parentanchor = top|right  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n        widgetanchor = top|right  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n        position = { -6 6 }  # 부모 앵커에 대한 오프셋\n        onclick = \"[CloseCard]\"  # 왼쪽 클릭 시 실행할 스크립트\n        icon = { texture = \"gfx/interface/icons/flat_icons/close.dds\" }  # 중첩된 아이콘, 추가 장식용\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "widget"]}, {"id": "text_single-", "name": "text_single (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`icon`이나 `button` 안에 `text_single = { ... }`을 중첩하면, 이미지 위에 바로 텍스트를 표시할 수 있습니다. 보통 단축 키, 수량, 마커 등을 표시하는 데 쓰입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    size = { 40 40 }  # 컨트롤의 너비와 높이를 설정합니다. 픽셀/백분율/-1 지원\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n    text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n        parentanchor = bottom|right  # 부모 컨테이너의 어느 앵커를 기준으로 위치를 잡을지 정의\n        widgetanchor = bottom|right  # 자신의 앵커를 정의하고 parentanchor와 맞춰 정렬\n        position = { -4 -4 }  # 부모 앵커에 대한 오프셋\n        text = \"F9\"  # 텍스트 내용(문자열 또는 표현식 사용 가능)\n        fontsize = 12  # 텍스트 폰트 크기\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "onclick", "name": "onclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "왼쪽\n键点击（抬起）时调用的脚本。通常直接执行一个 UI Action，例如 `\"[OpenLateralView('economy')]\"`。当按钮需要不同的点击模式，可以再配合 `action_tooltip`。", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    onclick = \"[OpenLateralView('economy')]\"  # 왼쪽 클릭 시 실행할 스크립트\n    text_single = { text = \"Open Economy\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightclick", "name": "onrightclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "우클릭 시 트리거되며, 리셋, 삭제, 상세 보기 같은 보조 동작을 실행하는 데 자주 사용됩니다. UI에서는 `action_tooltip`에 `on_right_click` 설명을 추가하는 것도 가능합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    tooltip = \"Right-click to clear pin\"  # 일반 툴팁 텍스트 또는 로컬라이즈 키\n    onrightclick = \"[PinCollection.Remove(MapMode.GetKey)]\"  # 오른쪽 클릭 시 실행할 스크립트\n    texture = \"gfx/interface/icons/flat_icons/pin.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ondoubleclick", "name": "ondoubleclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "더블클릭 이벤트로, 주로 지도 이동이나 상세 창 열기에 사용됩니다. 더블클릭은 두 번의 `onclick`을 포함하므로, 스크립트가 멱등(idempotent)하도록 주의해야 합니다.", "examples": [{"language": "gui", "code": "hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n    text_single = { text = \"[Location.GetName]\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    ondoubleclick = \"[PanToLocation(Location.Self)]\"  # 더블클릭 시 실행할 스크립트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onpressed", "name": "onpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "마우스 왼쪽 버튼을 누르는 순간에 트리거되며, 눌림 효과음 재생이나 드래그 시작 로직에 적합합니다. `onreleased`와 함께 사용해 동작을 마무리하는 것을 잊지 마세요.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    onpressed = \"[PlayAudioEffect('ui_click_down')]\"  # 왼쪽 버튼을 누르는 순간 트리거\n    onreleased = \"[PlayAudioEffect('ui_click_up')]\"  # 왼쪽 버튼을 뗄 때 트리거\n    texture = \"gfx/interface/icons/flat_icons/button.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onreleased", "name": "onreleased", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "왼쪽 버튼을 뗄 때(버튼 영역 안에 있는지 여부와 무관하게) 호출되며, 보통 마무리 애니메이션이나 효과음 정지에 사용됩니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    onpressed = \"[StartPressAnim]\"  # 왼쪽 버튼을 누르는 순간 트리거\n    onreleased = \"[StopPressAnim]\"  # 왼쪽 버튼을 뗄 때 트리거\n    text_single = { text = \"Holdable\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightpressed", "name": "onrightpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "오른쪽 버튼을 누르는 순간에 트리거됩니다. “우클릭을 누르고 있는 상태”가 필요한 동작이 있을 때만 사용하고, 그렇지 않다면 `onrightclick`만으로 충분합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    onrightpressed = \"[BeginMarqueeSelection]\"  # 오른쪽 버튼을 누르는 순간 트리거\n    onrightreleased = \"[EndMarqueeSelection]\"  # 오른쪽 버튼을 뗄 때 트리거\n    texture = \"gfx/interface/icons/flat_icons/selection.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightreleased", "name": "onrightreleased", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "오른쪽 버튼을 뗄 때 트리거되며, 대개 `onrightpressed`와 짝을 이루거나, 우클릭 유지 상태에서의 하이라이트를 해제하는 데 사용됩니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    onrightpressed = \"[ShowAltTooltip]\"  # 오른쪽 버튼을 누르는 순간 트리거\n    onrightreleased = \"[HideAltTooltip]\"  # 오른쪽 버튼을 뗄 때 트리거\n    text_single = { text = \"Hold RMB\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onmousehierarchyenter", "name": "onmousehierarchyenter", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "마우스가 현재 컨트롤과 그 모든 자식 컨트롤의 영역으로 진입할 때 트리거됩니다. 전형적인 용도: 지도 상에서 특정 객체를 하이라이트하거나, hover 효과음을 재생하거나, 애니메이션을 전환하는 경우입니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    onmousehierarchyenter = \"[PdxGuiWidget.SetHighlightLocation(Location.Self)]\"  # 마우스가 컨트롤 트리에 진입했을 때 트리거\n    onmousehierarchyleave = \"[PdxGuiWidget.ClearHighlightLocation(Location.Self)]\"  # 마우스가 컨트롤 트리에서 벗어날 때 트리거\n    texture = \"gfx/interface/icons/location.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onmousehierarchyleave", "name": "onmousehierarchyleave", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "마우스가 현재 컨트롤 트리 전체에서 벗어날 때 트리거되며, 보통 `onmousehierarchyenter`에서 적용했던 하이라이트나 애니메이션을 되돌리는 데 사용합니다.", "examples": [{"language": "gui", "code": "icon = {  # 중첩된 아이콘, 추가 장식용\n    onmousehierarchyenter = \"[HighlightCountry(Country.Self)]\"  # 마우스가 컨트롤 트리에 진입했을 때 트리거\n    onmousehierarchyleave = \"[ClearCountryHighlight]\"  # 마우스가 컨트롤 트리에서 벗어날 때 트리거\n    texture = \"gfx/interface/icons/country.dds\"  # 텍스처 경로 또는 스크립트 반환값을 지정\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onfocusout", "name": "onfocusout", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "입력 상자가 포커스를 잃었을 때 호출되며, 입력 값을 저장하거나 자동 완성 기능을 끄거나 상태를 초기화하는 데 사용할 수 있습니다.", "examples": [{"language": "gui", "code": "textbox = {\n    onfocusout = \"[SearchBar.OnFocusOut(PdxGuiWidget.AccessSelf, PdxGuiWidget.AccessParent.FindChild('autocomplete'))]\"  # 입력창이 포커스를 잃었을 때 트리거\n    text_single = { text = \"\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onreturnpressed", "name": "onreturnpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스트 상자 안에서 Enter 키를 눌렀을 때 트리거됩니다. 검색 제출, 이름 확정, 명령 실행 등에 자주 사용됩니다.", "examples": [{"language": "gui", "code": "textbox = {\n    onreturnpressed = \"[GameSaveNameWindow.CheckAndSave]\"  # Enter 키를 눌렀을 때 트리거\n    text_single = { text = \"\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_escape_pressed", "name": "on_escape_pressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "Esc 키를 포착하며, 일반적으로 검색 상자나 팝업을 닫는 데 사용합니다. `onreturnpressed`와 마찬가지로 키보드 포커스를 받을 수 있는 컨트롤에만 적용됩니다.", "examples": [{"language": "gui", "code": "textbox = {\n    on_escape_pressed = \"[FindLocationView.OnClose]\"  # Esc 키를 눌렀을 때 트리거\n    text_single = { text = \"\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_input_action_shortcut", "name": "on_input_action_shortcut", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "把控件和游戏内定义的输入动作（快捷键 / 手柄按键）바인딩\n起来。值是脚本表达式，例如 `\"[OnIncreaseGameSpeed]\"`。一个控件可以注册多个 `on_input_action_shortcut`。", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    on_input_action_shortcut = \"[OnIncreaseGameSpeed]\"  # 게임 내 단축키 액션 바인딩\n    on_input_action_shortcut = \"[OnDecreaseGameSpeed]\"  # 게임 내 단축키 액션 바인딩\n    text_single = { text = \"Speed +/-\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingstart", "name": "oneditingstart", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스트 편집이 시작될 때 트리거되며, 자동 완성 목록을 초기화하거나 이전 내용을 캐시하는 데 사용할 수 있습니다.", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingstart = \"[SearchBar.OnEditingStart(PdxGuiWidget.AccessSelf, PdxGuiWidget.AccessParent.FindChild('autocomplete'))]\"  # 텍스트 편집을 시작할 때 트리거\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingfinished", "name": "oneditingfinished", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "편집이 끝났을 때(내용 변경 여부와 관계없이) 트리거되며, 상태 정리나 최종 값에 맞추어 UI를 갱신하는 데 사용됩니다.", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingfinished = \"[GameLobby.SetName]\"  # 편집 종료\n辑（无论是否变更）触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingfinished_with_changes", "name": "oneditingfinished_with_changes", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스트의 최종 결과가 편집 시작 시점과 달라졌을 때만 트리거됩니다. 입력 검증이나 데이터 저장 등, 중복 제출을 피해야 하는 작업에 매우 적합합니다.", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingfinished_with_changes = \"[ModToolsGui.VerifyModName]\"  # 텍스트 전송 시에만\n生变化时触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextedited", "name": "ontextedited", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "텍스트 편집 중 내용이 바뀔 때마다 호출되는 콜백으로, 실시간 필터링, 동적 검증, 그래프 연동 등에 사용합니다. 여기에서는 비용이 큰 로직을 실행하지 않도록 주의해야 합니다.", "examples": [{"language": "gui", "code": "textbox = {\n    ontextedited = \"[AiCurrencyGlue.OnMinXChanged(PdxGuiWidget.Self)]\"  # 텍스트 내용이 실시간으로 변할 때 트리거\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextchanged", "name": "ontextchanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`textcontext`나 `text`가 스크립트에 의해 갱신될 때마다(편집 여부와 무관하게) 트리거됩니다. 예를 들어 “텍스트가 비어 있으면 숨기기” 같은 로직을 제어하는 데 자주 사용합니다.", "examples": [{"language": "gui", "code": "text_single = {  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n    ontextchanged = \"[UpdateVisibilityIfThereIsAnyText(PdxGuiWidget.AccessSelf)]\"  # text/textcontext 새로 고침 시 트리거\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextcontextchanged", "name": "ontextcontextchanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": nul = \"[SomeScript]\"` 时，按钮会自动使用这里的脚本。多用于需要“왼쪽\n键点击 = 行动”提示的控件。", "examples": [{"language": "gui", "code": "hbox = {  # 가로 컨테이너, 자식 컨트롤 배치\n    action_tooltip = {  # 좌클릭/우클릭/단축키 설명 정의\n        click_type = left\n        click_mode = instant\n        on_action = \"[GetScriptedGui('sakuya_tolerance_add').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).End)]\"  # action_tooltip에 바인딩된 좌클릭 스크립트\n    }\n    on_action = \"[GetScriptedGui('sakuya_tolerance_add').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).End)]\"  # action_tooltip에 바인딩된 좌클릭 스크립트\n    text_single = { text = \"Give tolerance\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_action_with_params", "name": "on_action_with_params", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`on_action`과 비슷하지만 스크립트가 추가 파라미터를 받을 수 있습니다(예: Outliner에서 내각 구성을 드래그할 때 슬롯 정보를 전달). 액션에 복잡한 컨텍스트가 필요하다면 이 버전을 사용합니다.", "examples": [{"language": "gui", "code": "widget = {\n    datamodel = \"[Cabinet.GetSlots]\"  # 데이터 모델을 바인딩해 자식 항목을 반복 생성\n    on_action_with_params = \"[Cabinet.AssigningCabinetMemberToSlot]\"  # 매개변수가 있는\n action_tooltip 脚本\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "action_tooltip", "name": "action_tooltip", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "Action tooltip 블록은 좌클릭/우클릭/단축 키 동작을 설명해, UI가 자동으로 안내 텍스트를 생성하도록 합니다. 보통 `click_type`, `click_mode`, `on_action`, `on_right_click`, `shortcut` 등의 필드를 포함합니다.", "examples": [{"language": "gui", "code": "button = {  # 중첩 버튼, 국소적인 상호작용 구현\n    action_tooltip = {  # 좌클릭/우클릭/단축키 설명 정의\n        click_type = left\n        click_mode = instant\n        on_action = \"[ConfirmOfferLoanAction.Execute]\"  # action_tooltip에 바인딩된 좌클릭 스크립트\n        on_right_click = \"[ConfirmOfferLoanAction.Clear]\"\n    }\n    onclick = \"[ConfirmOfferLoanAction.Execute]\"  # 왼쪽 클릭 시 실행할 스크립트\n    text_single = { text = \"Offer loan\" }  # 한 줄 텍스트를 표시하는 텍스트 컴포넌트\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button"]}]}</script>
<script>
'use strict';
const seed = JSON.parse(document.getElementById('DATA').textContent);
let ENTRIES = seed.entries;
const STATE = { regex:false, kinds:new Set(['Key','Event','Component','Group']), id:null };
const q = document.getElementById('q');
const res = document.getElementById('results');
const entry = document.getElementById('entry');
// 이벤트 바인딩 — 버튼은 항상 사용 가능해야 함
document.getElementById('btnSearch').onclick = ()=> render(q.value);
document.getElementById('btnClear').onclick = ()=>{ q.value=''; render(''); };
document.getElementById('btnRegex').onclick = (e)=>{
  STATE.regex = !STATE.regex;
  e.currentTarget.setAttribute('aria-pressed', STATE.regex);
  if(STATE.regex && !q.value.includes('re:true')) q.value = (q.value?' '+q.value:'') + ' re:true';
};
document.getElementById('btnHelp').onclick = ()=> alert([
  '검색：',
  '· 기본 AND (position alpha)',
  '· OR（position OR alpha）',
  '· 제외 (position -alpha)',
  '· 필드: type:key|event|component|group; parent:icon',
  '· 정규식: re:true 추가, 예: on.*click re:true'
].join('\\n'));
// Enter = 검색
q.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnSearch').click(); });
// 필터 chip
document.querySelectorAll('.chip').forEach(ch=>{
  ch.onclick = ()=>{
    const k = ch.dataset.kind;
    const pressed = ch.getAttribute('aria-pressed')==='true';
    ch.setAttribute('aria-pressed', (!pressed).toString());
    if(!pressed) STATE.kinds.add(k); else STATE.kinds.delete(k);
    render(q.value);
  };
});

// 단순 텍스트 인덱스
function buildIndex(entries){
  return entries.map(e=>({ id:e.id, name:e.name, kind:e.kind, parents:(e.parents||[]).join(' '),
    text:[e.name,e.kind,(e.parents||[]).join(' '),e.description,(e.tags||[]).join(' '),(e.used_by||[]).join(' ')].join(' ').toLowerCase()
  }));
}
let INDEX = buildIndex(ENTRIES);

function parseQuery(qs){
  const tokens=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(qs))!==null) tokens.push(m[1]||m[2]);
  const filters={}; const terms=[]; let regex=STATE.regex;
  for(const t of tokens){
    if(/^re:(true|1|yes)$/i.test(t)) { regex=true; continue; }
    const fm=t.match(/^(type|parent):(.+)$/i);
    if(fm){ filters[fm[1].toLowerCase()]=fm[2].toLowerCase(); continue; }
    terms.push(t);
  }
  return {filters,terms,regex};
}

function doSearch(qs){
  const {filters,terms,regex}=parseQuery(qs.trim());
  const results=[];
  for(const doc of INDEX){
    if(!STATE.kinds.has(doc.kind)) continue;
    if(filters.type && doc.kind.toLowerCase()!==filters.type) continue;
    if(filters.parent && !doc.parents.toLowerCase().includes(filters.parent)) continue;

    let pass=true;
    if(regex || /(^|\s)re:true(\s|$)/i.test(qs)){
      for(const t of terms){
        if(/^(type|parent):/i.test(t)||/^re:/i.test(t)) continue;
        try{ const r=new RegExp(t,'i'); if(!r.test(doc.text)) { pass=false; break; } }catch(err){ pass=false; break; }
      }
    }else{
      const inc=terms.filter(t=>!t.startsWith('-')); const exc=terms.filter(t=>t.startsWith('-')).map(s=>s.slice(1).toLowerCase());
      for(const t of inc){ if(!doc.text.includes(t.toLowerCase())) { pass=false; break; } }
      if(pass){ for(const t of exc){ if(doc.text.includes(t)) { pass=false; break; } } }
    }
    if(pass) results.push(doc);
  }
  // 간이 가중치: 정확한 이름 > 이름 포함
  results.sort((a,b)=>{
    const ql = qs.toLowerCase();
    const w=(d)=> (d.name.toLowerCase()===ql?50:0) + (d.name.toLowerCase().includes(ql)?10:0);
    const dw = w(b)-w(a);
    return dw!==0?dw:a.name.localeCompare(b.name);
  });
  return results.slice(0,400);
}

function highlight(s,qs){
  if(!qs) return escapeHtml(s);
  try{
    if(STATE.regex || /(^|\s)re:true(\s|$)/i.test(qs)){
      const body = qs.replace(/(^|\s)re:true(\s|$)/ig,' ').trim();
      const rx = new RegExp(body,'ig');
      return escapeHtml(s).replace(rx, m=> `<mark>${m}</mark>`);
    }
  }catch(e){}
  const words = qs.split(/\s+/).filter(Boolean).map(x=>x.toLowerCase()).filter(x=>!/^re:|^type:|^parent:/i.test(x) && x!=='or');
  let out = escapeHtml(s);
  for(const w of words){ out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>`<mark>${m}</mark>`); }
  return out;
}
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(qs){
  const rows = doSearch(qs||'');
  res.innerHTML = rows.map(r=>{
    const e = ENTRIES.find(x=>x.id===r.id);
    const info = [e.kind,(e.parents||[]).join(' / ')].filter(Boolean).join(' · ');
    return `<div class="result" data-id="${e.id}">
      <div><b>${highlight(e.name,qs||'')}</b></div>
      <div class="muted">${escapeHtml(info)}</div>
    </div>`;
  }).join('') || `<div class="result"><span class="muted">결과가 없습니다. 키워드를 줄이거나 Regex를 끄세요.</span></div>`;
  res.querySelectorAll('.result').forEach(el=> el.onclick = ()=> openEntry(el.dataset.id));
  if(STATE.id){ openEntry(STATE.id); }
}

function autolink(text){
  // 일반 텍스트에서만 간단한 용어 자동 링크 처리 (code/pre는 제외)
  const names = ENTRIES.map(e=>e.name).sort((a,b)=> b.length-a.length).slice(0,300);
  let html = escapeHtml(text).replace(/\\n/g,'<br>');
  for(const nm of names){
    const esc = nm.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');
    html = html.replace(new RegExp(`(^|[^\\w])(${esc})(?![\\w])`,'g'), (m,p1,p2)=> `${p1}<a href="#" data-jump="${nm}">${nm}</a>`);
  }
  return html;
}

function openEntry(id){
  STATE.id = id;
  const e = ENTRIES.find(x=>x.id===id); if(!e) return;
  const used = (e.used_by||[]).map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join(' ');
  const examples = (e.examples||[]).map(ex=> `<pre><code class="language-${ex.language||'gui'}">${escapeHtml(ex.code||'')}</code></pre>`).join('');
  const desc = autolink(e.description||'');
  entry.innerHTML = `
    <div class="muted">${escapeHtml((e.parents||[]).join(' › '))}</div>
    <h2>${escapeHtml(e.name)} <span class="pill">${escapeHtml(e.kind)}</span></h2>
    <div>${desc || '<span class="muted">(설명이 없습니다)</span>'}</div>
    <div class="hr"></div>
    <div><b>다음 컴포넌트에서 사용할 수 있습니다:</b> ${used || '<span class="muted">—</span>'}</div>
    ${examples? `<div class="hr"></div><div><b>예시</b></div>${examples}`:''}
  `;
  // 문서 내 점프
  entry.querySelectorAll('a[data-jump]').forEach(a=> a.onclick = (ev)=>{ ev.preventDefault(); const nm=a.getAttribute('data-jump'); const t=ENTRIES.find(x=>x.name===nm); if(t){ openEntry(t.id); const rEl=res.querySelector(`[data-id="${t.id}"]`); if(rEl) rEl.scrollIntoView({block:'nearest'});} });
}

// 최초 렌더링: 전체 표시 (이름순 정렬)
render('');
</script>
</body>
</html>
